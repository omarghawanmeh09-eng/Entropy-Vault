<title>تحدي خزنة الإنتروبيا</title>
<style>
:root{color-scheme:light;--bg:#f2f9f6;--card:#fff;--tx:#1b2b26;--mut:#5d7068;--ac:#12a37f;--acx:#fff;--gd:#c98a00;--ok:#2a9d4f;--bad:#d9435b;--bd:#d9ebe3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--tx);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.w{max-width:560px;margin:0 auto;padding:12px 14px 30px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0 8px}
.logo{font-weight:800;font-size:17px}
nav button,.lnk{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:20px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.lnk{border:0;color:var(--mut);font-size:12px;text-decoration:underline}
h1{font-size:25px;margin:6px 0}h2{font-size:18px;margin:0 0 8px}
.sub{color:var(--mut);font-size:14px;margin:6px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-top:12px}
.hero{text-align:center;background:linear-gradient(160deg,#fff,#dff5ec)}
.em{font-size:54px}.c{text-align:center}
.steps{padding-inline-start:22px;margin:0}.steps li{margin:6px 0}
label{display:block;font-size:14px;color:var(--mut);margin-top:12px}
input{font:inherit;font-size:16px;color:inherit;background:var(--bg);border:1.5px solid var(--bd);border-radius:12px;padding:12px;width:100%;margin-top:4px}
input:focus{outline:2px solid var(--ac);border-color:var(--ac)}
.btn{display:block;width:100%;min-height:50px;margin-top:12px;border:0;border-radius:14px;background:var(--ac);color:var(--acx);font:inherit;font-weight:700;cursor:pointer}
.warn{background:#fff3cd;border:1.5px solid #e0a100;border-radius:12px;padding:10px 14px;margin:10px 0;text-align:start}.warn.ok{background:#e3f6ea;border-color:var(--ok)}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn.ghost{background:none;border:1.5px solid var(--bd);color:var(--tx)}
.btn.red{background:var(--bad);color:#fff}
.err{color:var(--bad);min-height:1.5em;font-size:14px;margin-top:8px}
.sticky{position:sticky;top:env(safe-area-inset-top,0);z-index:5;background:var(--bg);padding:6px 0}
.bar{display:flex;justify-content:space-between;gap:6px;font-size:14px;font-weight:600}
.pb{height:6px;background:var(--bd);border-radius:6px;margin-top:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac);transition:width .4s}
.vault{text-align:center;background:linear-gradient(160deg,#fff8e1,#f6dd96);color:#3b2d00;border:3px solid var(--gd)}
.dials{direction:ltr;display:flex;gap:8px;justify-content:center;margin:10px 0}
.dials input{width:60px;height:64px;text-align:center;font-size:30px;font-weight:800;padding:0;background:#0a0f0d;color:#6dffb8;border-color:#44564c;margin:0}
.vault .btn{background:#1f3d33;color:#fff;margin-top:4px}
.vault.shake{animation:sk .4s}@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hints{text-align:start;font-size:14px;margin:10px 0 0;padding:0;list-style:none}
.hints li{background:#0000000d;border-radius:10px;padding:5px 10px;margin-top:5px}
.tag{color:var(--ac);font-weight:700;font-size:13px}.q{font-size:18px;font-weight:700;margin:6px 0}
.eq{direction:ltr;text-align:center;font-family:ui-monospace,Menlo,monospace;background:var(--bg);border-radius:10px;padding:8px;margin:8px 0;overflow-x:auto}
.o{display:block;width:100%;min-height:52px;margin-top:8px;padding:11px 14px;background:var(--bg);border:1.5px solid var(--bd);border-radius:12px;text-align:start;font:inherit;color:inherit;cursor:pointer}
.o.ok{border-color:var(--ok);background:#dff3e5;background:color-mix(in srgb,var(--ok) 20%,transparent)}
.o.no{border-color:var(--bad);background:#fbe0e5;background:color-mix(in srgb,var(--bad) 20%,transparent)}
.ex{margin-top:12px;font-size:14px;color:var(--mut)}
.tabs button{background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:20px;padding:5px 14px;margin-inline-end:6px;font:inherit;font-size:13px}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.sc{overflow-x:auto;margin-top:8px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:start}
.cf{position:fixed;top:-30px;font-size:24px;animation:fall 3s linear forwards;pointer-events:none;z-index:9}@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
.prize{font-size:20px;font-weight:800;color:var(--gd)}
footer{text-align:center;margin-top:20px}
.kbd{display:none;min-width:24px;height:24px;line-height:24px;text-align:center;border-radius:6px;background:#e7f6ef;color:var(--ac);font-weight:800;font-size:13px;margin-inline-end:10px}
.o{display:flex;align-items:center}.o.used{opacity:.45}
.vis{margin:10px 0}.vis canvas{height:170px}.vlab{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--mut);margin-top:4px}.vlab span{width:42%;text-align:center}
.nrow{display:flex;gap:8px;align-items:center;direction:ltr;margin-top:8px}.nrow input{margin:0;font-size:20px;font-weight:700;text-align:center;flex:1}.unit{font-weight:700;color:var(--mut);white-space:nowrap}
input.ok{border-color:var(--ok);background:#dff3e5}input.no{border-color:var(--bad);background:#fbe0e5}
.seq{min-height:44px;margin:8px 0;padding:8px 30px 8px 12px;border:2px dashed var(--bd);border-radius:12px;background:#fafdfb}.seq li{margin:4px 0;font-weight:700}.seq.ok{border-color:var(--ok);background:#dff3e5}.seq.no{border-color:var(--bad);background:#fbe0e5}
.cr{border:1.5px solid var(--bd);border-radius:12px;padding:10px;margin-top:8px;background:var(--bg)}.cr.ok{border-color:var(--ok);background:#dff3e5}.cr.no{border-color:var(--bad);background:#fbe0e5}
.cl{font-weight:700;margin-bottom:8px}.cb{display:flex;gap:6px;flex-wrap:wrap}.cbt{flex:1;min-width:90px;min-height:42px;border:1.5px solid var(--bd);background:#fff;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;color:var(--tx)}.cbt.on{background:var(--ac);color:#fff;border-color:var(--ac)}.fix{font-size:13px;color:var(--ok);margin-top:6px;font-weight:700}
.ex>div{white-space:pre-line}.okl{margin:4px 0 6px;padding-inline-start:24px;font-weight:700;color:var(--tx)}.seqh{font-size:12px;color:var(--mut);margin-top:6px}.ph{margin-top:10px;background:#eef7ff;border:1px solid #cfe2f5;border-radius:10px;padding:8px 10px;color:var(--tx)}
@media (min-width:900px){
body{font-size:17px}.w{max-width:1180px;padding:18px 28px 40px}
#app>section,#tpanel>section{max-width:780px;margin-inline:auto}
.gwrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
.gwrap>aside{grid-column:2;grid-row:1;position:sticky;top:100px}.gwrap>#qa{grid-column:1;grid-row:1}
.gwrap #qa .card:first-child{margin-top:12px}
.q{font-size:21px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opts .o{margin-top:0}
.kbd{display:inline-block}.vis canvas{height:230px}canvas.lab{height:240px}
.o:hover:not(:disabled),.cbt:hover:not(:disabled){border-color:var(--ac)}
.sticky{padding:10px 0}}
header{flex-wrap:wrap}nav{display:flex;gap:6px;flex-wrap:wrap}
canvas.lab{width:100%;height:190px;background:#f7fcfa;border:1px solid var(--bd);border-radius:12px;display:block}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--ac);margin-top:6px}
summary{font-weight:800;font-size:17px;cursor:pointer;margin-bottom:6px}
.chips span{display:inline-block;background:#e7f6ef;border:1px solid var(--bd);border-radius:20px;padding:3px 12px;margin:3px;font-size:13px}
.gbars{direction:ltr;margin-top:10px}.br{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}.br span{width:46px}.br b{width:64px;text-align:end}
.tb{text-align:center;margin:2px 0 0}.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:8px 18px;border-radius:20px;font-weight:700;z-index:20;animation:tst 1.8s forwards;pointer-events:none}@keyframes tst{0%{opacity:0;top:60px}15%{opacity:1;top:80px}80%{opacity:1}100%{opacity:0}}
.help{background:#f1faf6;border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:12px}.tr{position:relative;flex:1;height:16px;background:#e9f4ef;border-radius:8px;overflow:hidden}.tr:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#9db3a9}.tr i{position:absolute;top:0;bottom:0}
</style>
</head>

$("sv").onclick=()=>{PRIZE=$("pz").value.trim()||PRIZE;S.set("ev3_prize",PRIZE);$("pm").textContent="تم حفظ الجائزة ✅"};
$("cp").onclick=async()=>{const t=rows.filter(r=>r&&r.sg===sign(r)).sort((x,y)=>(!!y.opened-!!x.opened)||(x.time-y.time)).map((r,i)=>(i+1)+". "+r.team+" ("+r.members+") - "+fmt(r.time)+" - "+r.correct+"/"+NQ+" "+(r.opened?"🔓":"🔒")).join("\n");try{await navigator.clipboard.writeText(t);$("pm").textContent="تم النسخ ✅"}catch(e){$("pm").textContent="تعذّر النسخ"}};
$("cl").onclick=()=>{if(confirm("مسح كل النتائج؟")){rows=[];S.set("ev3_rows",rows);$("pm").textContent="تم المسح"}};
$("cx").onclick=()=>$("tpanel").innerHTML="";
$("ib").onclick=()=>{let n=0,bad=0;$("im").value.split(/\s+/).filter(l=>l.length>60).forEach(l=>{try{const r=JSON.parse(dec(l));if(r&&r.sg===sign(r)&&!rows.some(x=>x.sg===r.sg)){rows.push(r);n++}else bad++}catch(e){bad++}});S.set("ev3_rows",rows);$("pm").textContent="تم استيراد "+n+" نتيجة"+(bad?" · مرفوض "+bad:"")};
$("ab").onclick=()=>{if(confirm("إلغاء اللعبة الجارية على هذا الجهاز؟")){G=null;S.set("ev3_game",null);$("tpanel").innerHTML="";home()}}}
$("tp").onclick=()=>{const p=S.get("ev3_pin",null);
if(!p){const n=prompt("أول مرة: اختاروا رمز سري للمعلم (4 أحرف أو أكثر)");if(!n||n.length<4)return;S.set("ev3_pin",H(n,7));return alert("تم حفظ الرمز. اضغطوا 'وضع المعلم' مرة ثانية للدخول.")}
const n=prompt("رمز المعلم");if(n===null)return;if(H(n,7)!==p)return alert("الرمز غير صحيح");panel()};
$("nh").onclick=home;$("nl").onclick=board;
window.addEventListener&&window.addEventListener("storage",e=>{if(e.key==="ev3_game"||e.key==="ev3_rows")location.reload()});
home();
})();/*E*/
</script>
